name: Manual Football Data Collection

on:
  workflow_dispatch:
    inputs:
      matches:
        description: '比赛列表，每行一场，格式：周四005 法甲 图卢兹 VS 里尔'
        required: true
        default: '周四005 法甲 图卢兹 VS 里尔'
        type: string

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run data collection
        env:
          INPUT_MATCHES: ${{ github.event.inputs.matches }}
          DINGTALK_WEBHOOK: ${{ secrets.DINGTALK_WEBHOOK }}
          DINGTALK_SECRET: ${{ secrets.DINGTALK_SECRET }}
          OPENWEATHER_API_KEY: ${{ secrets.OPENWEATHER_API_KEY }}
        run: |
          python src/main.py

      # ✅ 关键修改：将 actions/upload-artifact 从 v3 升级到 v4
      - name: Upload JSON artifact
        uses: actions/upload-artifact@v4
        with:
          name: collected-data
          path: output/*.json

      - name: Notify failure
        if: failure()
        run: |
          echo "采集失败，请查看Actions日志"
