name: Manual Football Data Collection

on:
  workflow_dispatch:
    inputs:
      matches:
        description: '比赛列表，每行一场，格式：周四005 法甲 图卢兹 VS 里尔'
        required: true
        default: '周四005 法甲 图卢兹 VS 里尔'
        type: string

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      # 关键步骤：安装 Playwright 浏览器（供 odds_api.py 使用）
      - name: Install Playwright browsers
        run: |
          playwright install
          playwright install-deps

      - name: Run data collection
        env:
          INPUT_MATCHES: ${{ github.event.inputs.matches }}
          DINGTALK_WEBHOOK: ${{ secrets.DINGTALK_WEBHOOK }}
          DINGTALK_SECRET: ${{ secrets.DINGTALK_SECRET }}
          OPENWEATHER_API_KEY: ${{ secrets.OPENWEATHER_API_KEY }}
        run: |
          python src/main.py

      - name: Upload JSON artifact
        uses: actions/upload-artifact@v4
        with:
          name: collected-data
          path: output/*.json

      - name: Notify failure
        if: failure()
        run: |
          echo "采集失败，请查看Actions日志"
